<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <div class="sidebar" style="color: white;">

            <div class="section1">
                <div class="instagram" style="font-size: 25px;"><i class="fa-brands fa-instagram"></i></div>
            </div>

            <div class="section2">
                <div class="home" style="font-size: 24px;"><i class="fa-solid fa-house"></i></div>
                <div class="reels" style="font-size: 25px;"><i class="fa-regular fa-circle-play"></i></div>
                <div class="message" style="font-size: 21px;"><i class="fa-regular fa-paper-plane fa-rotate-by" style="--fa-rotate-angle: 20deg;"></i></i></div>
                <div class="search" style="font-size: 23px;"><i class="fa-solid fa-magnifying-glass"></i></div>
                <div class="like" style="font-size: 24px;"><i class="fa-regular fa-heart"></i></div>
                <div class="create" style="font-size: 24px;"><i class="fa-solid fa-plus"></i></div>
                <div class="profile"><img src="download.jpg" style="border-radius: 100%; width: 25px; height: 25px;" alt=""></div>
            </div>
            
            <div class="section3">
                <div class="more" style="font-size: 24px;"><i class="fa-solid fa-bars"></i></div>
                <div class="meta" style="font-size: 24px;"><i class="fa-solid fa-cubes"></i></div>

            </div>
        </div>
    </div>
</body>
</html>
