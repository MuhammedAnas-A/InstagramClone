<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="home.css">
    <link rel="icon" href="insta.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <!-- sidebar section  -->

        <div class="sidebar" style="color: white;">

            <div class="section1">
                <div class="instagram" style="font-size: 25px;"><i class="fa-brands fa-instagram"></i></div>
            </div>

            <div class="section2">
                <div class="home" style="font-size: 24px;"><i class="fa-solid fa-house"></i></div>
                <div class="reels" style="font-size: 25px;"><i class="fa-regular fa-circle-play"></i></div>
                <div class="message" style="font-size: 21px;"><i class="fa-regular fa-paper-plane fa-rotate-by" style="--fa-rotate-angle: 20deg;"></i></i></div>
                <div class="search" style="font-size: 23px;"><i class="fa-solid fa-magnifying-glass"></i></div>
                <div class="like" style="font-size: 24px;"><i class="fa-regular fa-heart"></i></div>
                <div class="create" style="font-size: 24px;"><i class="fa-solid fa-plus"></i></div>
                <div class="profile"><img src="download.jpg" style="border-radius: 100%; width: 25px; height: 25px;" alt=""></div>
            </div>
            
            <div class="section3">
                <div class="more" style="font-size: 24px;"><i class="fa-solid fa-bars"></i></div>
                <div class="meta" style="font-size: 24px;"><i class="fa-solid fa-cubes"></i></div>

            </div>
        </div>

        <!-- story section  -->

        <div class="top-section">
            
            <div class="story-section">
                <div class="stories">
                    
                    <div class="storyBorder">
                        <img class="profile1" src="athul.jpg" alt="">
                    </div>
                    <p>at.hu.l</p>
                </div>
                <div class="stories">
                    
                    <div class="storyBorder">
                        <img class="profile2" src="shazz.jpg" alt="">
                    </div>
                    <p>callmesha...</p>
                    
                </div>
                <div class="stories">
                    
                    <div class="storyBorder">
                        
                        <img class="profile3" src="hari.jpg" alt="">
                        
                    </div>
                    <p>_harinand...</p>
                    
                </div>
                <div class="stories">
                    
                    <div class="storyBorder">
                        
                        <img class="profile4" src="nishad.jpg" alt="">
                    </div>
                    <p>nishad_ka...</p>
                    
                </div>
                <div class="stories">
                    
                    <div class="storyBorder">
                        
                        <img class="profile5" src="mubarak.jpg" alt="">
    
                    </div>
                    <p>iyem_mub...</p>
                    
                </div>
                <div class="stories">
                    
                    <div class="storyBorder">
                        
                        <img class="profile5" src="anurudhh.jpg" alt="">
    
                    </div>
                    <p>4nurudhhh</p>
                    
                    <div class="arrow-icon">
    
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- post section  -->

        <div class="home-section">
            <div class="post-section">
                <div class="post1">
                    <div class="header">
                        <div class="name1">
                            <div class="bar1">
                                <img src="madrid.jpg" alt="">
                            </div>
                            <div class="bar2">
                                <p style="font-size: 13px; font-weight: 600; color:white;">madridxtra_</p>
                                <img style="width: 13px; height: 13px; border-radius: 5px; margin-bottom: -5px; margin-left:-8px;" src="verified.PNG" alt="">
                                <p style="color: gray; margin-top: -15px; font-size: 28px;margin-left:-8px">.</p>
                                <p style="color: gray; margin-left:-10px">10h</p>
                            </div>

                        </div>
                        <div class="name2">
                            <p style="font-size: 18px; padding-right: 15px; padding-bottom: 12px; font-size: 22px; cursor: pointer; color: white;">...</p>
                        </div>
                    </div>
                    <!-- post-1 -->
                    <div class="post">
                        <img src="rono.jpg" alt="">
                    </div>
                    <div  class="like">
                        <div class="count">
                        <!-- feedback-section -->
                        <div class="likecount"><i class="fa-regular fa-heart"></i></div>
                        <div class="comment"><i class="fa-regular fa-comment fa-rotate-270"></i></div>  
                        <div class="repost"><i class="fa-solid fa-retweet fa-rotate-270"></i></div>    
                        <div class="share"><i class="fa-regular fa-paper-plane fa-rotate-by" style="--fa-rotate-angle: 20deg;"></i></div>
                        <div class="save">
                            <i class="fa-regular fa-bookmark"></i>
                        </div>
                           
                        <div class="writings">
                            <p>228k</p>  
                            <p>1,071</p>
                            <p>4,279</p>
                            <p>41,100</p>
                        </div>
                    
                    

                    </div>
                    <div class="likedby">
                       <img src="kassi.jpeg" style="height:18px; width: 18px; border-radius: 50%; cursor: pointer;" alt="">
                       <p>Likedby <span style="font-weight: 600; cursor: pointer;">m_shifas</span> and <span style="font-weight: 600; cursor: pointer;">278k others</span></p>
                    </div>
                    <div class="caption">
                        <p style="font-weight: 600; font-size: 14px; cursor: pointer;">madridxtra_</p>
                        <img src="verified.PNG" alt="">
                        <p style="font-size: 14px; font-weight: 400;">When Real Madrid welcomed a king.</p>
                    </div>
                </div>
                </div>
                <!-- post-2 -->
                
            </div>
        </div>

    </div>
</body>
</html>
